<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="12" dy="12" stdDeviation="0" flood-color="#0f172a" flood-opacity="1" />
    </filter>
  </defs>
  <!-- Background Neo-brutalist Outer Card with Border -->
  <rect x="20" y="20" width="460" height="460" rx="90" fill="url(#grad)" stroke="#0f172a" stroke-width="16" filter="url(#shadow)" />
  
  <!-- Handshake and Heart Graphic -->
  <g transform="translate(116, 116)" stroke="#0f172a" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Heart background -->
    <path d="M140 40 C90 -10, 20 20, 140 150 C260 20, 190 -10, 140 40 Z" fill="#f43f5e" stroke="#0f172a" stroke-width="16" />
    
    <!-- Cash Coins Overlay -->
    <circle cx="140" cy="110" r="32" fill="#fbbf24" stroke="#0f172a" stroke-width="12" />
    <path d="M140 98 v24 M132 110 h16" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
